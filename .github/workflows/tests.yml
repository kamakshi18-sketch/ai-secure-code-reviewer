name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: sqlite+aiosqlite:///:memory:
  REDIS_URL: redis://localhost:6379/1
  CHROMADB_URL: http://localhost:8000
  SECRET_KEY: test-secret-key-for-testing-only-32-chars
  OPENAI_API_KEY: test-key
  ANTHROPIC_API_KEY: test-key
  LOG_LEVEL: DEBUG
  ENVIRONMENT: test

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_reviewer
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ai_code_reviewer_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ai_reviewer -d ai_code_reviewer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      chromadb:
        image: chromadb/chroma:0.4.22
        ports:
          - "8000:8000"
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend linting
        run: |
          cd backend
          ruff check .
          black --check .
          isort --check .
          mypy .

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://ai_reviewer:test_password@localhost:5432/ai_code_reviewer_test
          REDIS_URL: redis://localhost:6379/1
          CHROMADB_URL: http://localhost:8000
          SECRET_KEY: test-secret-key-for-testing-only-32-chars
          OPENAI_API_KEY: dummy-key
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head
          pytest --cov=./ --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend linting
        run: |
          cd frontend
          npm run lint

      - name: Run frontend type checking
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test -- --run

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai_reviewer
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ai_code_reviewer_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ai_reviewer -d ai_code_reviewer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      chromadb:
        image: chromadb/chroma:0.4.22
        ports:
          - "8000:8000"
        options: >-
          --health-cmd "curl -f http://localhost:8000/api/v1/heartbeat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Start backend
        env:
          DATABASE_URL: postgresql+asyncpg://ai_reviewer:test_password@localhost:5432/ai_code_reviewer_test
          REDIS_URL: redis://localhost:6379/1
          CHROMADB_URL: http://localhost:8000
          SECRET_KEY: test-secret-key-for-testing-only-32-chars
          OPENAI_API_KEY: dummy-key
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Start frontend
        run: |
          cd frontend
          npm run preview -- --port 3000 --host &
          sleep 10

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            frontend/test-results.json
            frontend/test-results.xml
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r backend/ -f json -o bandit-results.json || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ai-code-reviewer-backend:test
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ai-code-reviewer-frontend:test
          load: true

      - name: Test backend image
        run: |
          docker run --rm -d --name backend-test -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: \
            -e SECRET_KEY=test \
            -e ENVIRONMENT=test \
            ai-code-reviewer-backend:test
          sleep 10
          curl -f http://localhost:8000/health
          docker stop backend-test

      - name: Test frontend image
        run: |
          docker run --rm -d --name frontend-test -p 3000:3000 \
            ai-code-reviewer-frontend:test
          sleep 5
          curl -f http://localhost:3000
          docker stop frontend-test

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, playwright-tests, security-scan, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    timeout-minutes: 15
    
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploy to staging environment"
          # Add your staging deployment commands here

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 15
    
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploy to production environment"
          # Add your production deployment commands here